[project]
name = "stratum-db"
version = "1.0.0"
description = "A standalone write-optimized LSM-tree key-value database"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Vishnu Sai Paineni"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
requires-python = ">=3.12"
dependencies = [
    "sortedcontainers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
metadata = ["sqlalchemy", "psycopg[binary]"]
server = ["grpcio", "grpcio-tools", "python-dotenv"]
dev = ["pytest", "hypothesis"]

[project.urls]
Homepage = "https://github.com/VishnuP2412/stratum-db"
Repository = "https://github.com/VishnuP2412/stratum-db"
Issues = "https://github.com/VishnuP2412/stratum-db/issues"

[project.scripts]
stratum-server = "stratum.api:main"

[tool.setuptools.packages.find]
include = ["stratum*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
	"timeout(seconds): mark test to fail if it exceeds the given number of seconds",
	"slow: mark tests that are excluded from the default suite"
]