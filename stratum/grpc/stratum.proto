syntax = "proto3";

package stratum;

service Stratum {
    rpc Get (GetRequest) returns (GetResponse);

    rpc Put (PutRequest) returns (PutResponse);
}

message GetRequest {
    bytes key = 1;
}

message GetResponse {
    bytes value = 1;
    bool found = 2;
}

message PutRequest {
    bytes key = 1;
    bytes value = 2;
}

message PutResponse {
    bool success = 1;
}