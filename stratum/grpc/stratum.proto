syntax = "proto3";

package stratum;

service Stratum {
    rpc Get (GetRequest) returns (GetResponse);

    rpc Put (PutRequest) returns (PutResponse);

    // Returns keys in the inclusive range [start_key, end_key].
    rpc Scan (ScanRequest) returns (stream KVPair);
}

message GetRequest {
    bytes key = 1;
}

message GetResponse {
    bytes value = 1;
    bool found = 2;
}

message PutRequest {
    bytes key = 1;
    bytes value = 2;
}

message PutResponse {
    bool success = 1;
}

message ScanRequest {
    bytes start_key = 1;
    bytes end_key = 2;
}

message KVPair {
    bytes key = 1;
    bytes value = 2;
}